[project]
name = "nevereats-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi[standard]>=0.115,<1", "pydantic>=2,<3", "sqlmodel>=0.0.22,<1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
extend-exclude = [".venv.nosync", ".venv-old.nosync"]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.setuptools.packages.find]
include = ["app*"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
